[tools]
"aqua:runkids/skillshare" = "latest"
hk = { version = "latest", workflow = "release.yml" }
"npm:@fission-ai/openspec" = "latest"
node = "latest"
lazygit = "latest"
git-cliff = "2.14.2"
gh = "2.103.3"

[settings]
skills.dir = ".agents/skills"
skills.auto_sync = true

[tasks."skills:mise"]
description = "Sync mise skills"
hide = true
run = [
  "mise skills sync",
  "mise skills sync --dir .claude/skills",
]

[tasks."skills:skillshare"]
description = "Sync skillshare skills"
run = [
  "skillshare install -p",
  "skillshare sync -p",
]

[tasks."skills:openspec"]
description = "Sync openspec skills"
hide = true
run = [
  "openspec init --tools claude",
  "openspec init --tools agents",
]

[tasks."skills:sync"]
description = "Sync all skills"
# Sequential: subtasks write to the same skill dirs
run = [
  { task = "skills:mise" },
  { task = "skills:skillshare" },
  { task = "skills:openspec" },
]

[hooks]
postinstall = [
  "mise run skills:sync",
  "hk install",
]

[tasks.release]
description = "Bump version, tag, push and publish a GitHub release"
shell = "bash -c"
usage = 'flag "-y --yes" help="Skip the confirmation prompt"'
run = '''
set -euo pipefail
if [ -n "$(git status --porcelain)" ]; then
  echo "release: dirty tree, commit or stash first" >&2
  exit 1
fi
if [ "$(git branch --show-current)" != main ]; then
  echo "release: not on main" >&2
  exit 1
fi
git fetch -q
if [ "$(git rev-parse @)" != "$(git rev-parse @{u})" ]; then
  echo "release: main not in sync with origin" >&2
  exit 1
fi
gh auth status >/dev/null
v=$(git cliff --bumped-version 2>/dev/null)
if [ "$v" = "$(git describe --tags --abbrev=0 2>/dev/null)" ]; then
  echo "release: nothing to release since $v"
  exit 0
fi
notes=$(git cliff --unreleased --tag "$v" --strip all 2>/dev/null | sed '1{/^## /d}' | sed '/./,$!d')
printf '%s\n\n%s\n\n' "$v" "$notes"
if [ "${usage_yes:-false}" != "true" ]; then
  read -r -p "README and RECIPE updated? Release $v? [y/N] " answer
  if [ "$answer" != "y" ]; then
    echo "release: cancelled" >&2
    exit 1
  fi
fi
npm version "${v#v}" -m "chore: release v%s"
git push --follow-tags
echo "$notes" | gh release create "$v" --title "$v" --notes-file - --verify-tag
'''
